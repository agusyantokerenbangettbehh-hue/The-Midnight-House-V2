<html>

  <head>

    <title>The House of 404</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="crate.css">

  </head>

  <body>

    <div class="all">

      <div class="header">

        <h1>The House of 404 - Multiplayer - Coming soon!!</h1>

      </div>

      <div class="container">

        <div class="crate">

          <h2>Create room</h2>

          <form>

            <div class="roomname">

              <label for="roomname">Masukan nama room</label>

              <input type="text" id="roomname" placeholder="Nama room" required>

            </div>

            <div class="roomtype">

              <p>Room type</p>

              <input type="radio" id="publik" name="roomtype" value="publik" checked>
              <label for="publik">Public</label>

              <input type="radio" id="private" name="roomtype" value="private">
              <label for="private">Private</label>

            </div>

            <div class="maxplayer">

              <label for="player">Max player</label>

              <select id="player">

                <option>2 Player</option>
                <option>3 Player</option>
                <option>4 Player</option>

              </select>

            </div>

            <button type="submit">Create Room</button>

          </form>

          <a href="multiplayer.html">
            Back
            <img src="img/back.png">
          </a>

        </div>

      </div>

      <div class="footer">

        <p>&copy; 2026 The House of 404</p>

      </div>

    </div>

  </body>

</html>
